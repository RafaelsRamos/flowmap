# yaml-language-server: $schema=https://raw.githubusercontent.com/RafaelsRamos/flowmap/main/packages/schema/flow.schema.json
schemaVersion: 1
flow: order-fulfilment
description: From order placement to delivery
correlationKey: orderId
start: order-placed
end: [delivered]

nodes:
  - id: order-placed
    label: Order placed
    description: The customer submits the cart and an order is created.
    service: orders-api
    code: src/orders/PlaceOrder.kt#handle
    evidence:
      source: orders-api
      match:
        event: [order.placed]
        correlate: attributes.order_id
      outcome:
        success: order.placed

  - id: stock-check
    label: Stock check
    description: Reserves the ordered items in the warehouse inventory.
    service: inventory
    code: src/inventory/ReserveStock.kt#reserve
    evidence:
      source: inventory
      match:
        event: [stock.reserved, stock.unavailable]
        correlate: attributes.order_id
      outcome:
        success: stock.reserved
        failure: stock.unavailable

  - id: payment
    label: Payment
    description: Charges the customer's card; a declined card is retried.
    service: payments-api
    code: src/payments/ChargeHandler.kt#charge
    evidence:
      source: payments-api
      match:
        event: [payment.attempted, payment.declined, payment.approved]
        correlate: attributes.order_id
      outcome:
        success: payment.approved
        failure: payment.declined
      display: # fields shown in the expanded node
        Status: last(event)
        Amount: attributes.amount
        Attempts: count(payment.attempted)

  - id: pick-pack
    label: Pick & pack
    description: Warehouse staff pick the reserved items and pack the parcel.
    service: warehouse
    code: src/warehouse/PackOrder.kt#pack
    evidence:
      source: warehouse
      match:
        event: [pack.completed]
        correlate: attributes.order_id
      outcome:
        success: pack.completed

  - id: out-for-delivery
    label: Out for delivery
    description: A courier carries the parcel to the customer; if nobody is home it is tried again.
    service: delivery
    evidence:
      source: delivery
      match:
        event: [delivery.dispatched, delivery.not_home, delivery.signed]
        correlate: attributes.order_id
      outcome:
        success: delivery.signed
      display:
        Not home: count(delivery.not_home)

  - id: delivered
    label: Delivered
    description: The customer signs for the parcel.
    service: delivery
    evidence:
      source: delivery
      match:
        event: [delivery.signed]
        correlate: attributes.order_id
      outcome:
        success: delivery.signed

edges:
  - { from: order-placed, to: stock-check }
  - { from: order-placed, to: payment }
  - { from: stock-check, to: pick-pack, label: reserved, when: stock.reserved }
  - { from: payment, to: payment, label: retry, when: payment.declined }
  - { from: payment, to: pick-pack, label: paid, when: payment.approved }
  - { from: pick-pack, to: out-for-delivery }
  - { from: out-for-delivery, to: out-for-delivery, label: not home, when: delivery.not_home }
  - { from: out-for-delivery, to: delivered, label: signed, when: delivery.signed }
